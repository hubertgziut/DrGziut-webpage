<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>DrGziut</title>
    <script>
      (function () {
        var segmentCount = 1;
        var location = window.location;
        var repositoryRoot = location.pathname.split('/').slice(0, 1 + segmentCount).join('/');
        var route = location.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~');
        var query = location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '';
        location.replace(
          location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
          repositoryRoot + '/?/' + route + query + location.hash
        );
      }());
    </script>
  </head>
  <body></body>
</html>
