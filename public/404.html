<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <script>
    // GitHub Pages SPA fallback: preserve deep links for React Router
    var path = window.location.pathname.replace(/^\/DrGziut-webpage\/?/, '');
    var query = window.location.search ? window.location.search.slice(1).split('&').map(function (s) { return s.replace(/&/g, '~and~'); }).join('&') : '';
    var target = '/DrGziut-webpage/?/' + path + (query ? '&' + query : '') + window.location.hash;
    window.location.replace(target);
  </script>
</head>
<body></body>
</html>
